name: Build Fir APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Fir source
        run: |
          rm -rf Fir-Android-Source-v12
          unzip -q Fir-Android-Source-v12.zip
          rm -f "Fir-Android-Source-v12/app/src/main/java/com/fir/translate/core/ClipboardHistoryManager-1.kt"

      - name: Build debug and release APKs
        working-directory: Fir-Android-Source-v12
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Fir-APKs
          path: |
            Fir-Android-Source-v12/app/build/outputs/apk/debug/app-debug.apk
            Fir-Android-Source-v12/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
