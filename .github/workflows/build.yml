name: Build Fir APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract and build
        run: |
          unzip -q Fir-Android-Source-v10.zip -d fir
          gradle -p fir assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Fir-v9-APKs
          path: |
            fir/app/build/outputs/apk/debug/app-debug.apk
            fir/app/build/outputs/apk/release/app-release.apk
